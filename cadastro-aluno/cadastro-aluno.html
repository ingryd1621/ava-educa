<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="./cadastro-aluno.css">
    <script type="module" src="./cadastro-aluno.js" defer></script>
</head>

<body>
    <header class="cabecalho">
        <h1>AVA-EDUCA+</h1>
        <span id="usuarioLogado">Usuário logado</span>
    </header>
    <div class="layout">
        <aside class="menu-lateral">
            <nav>
                <a href="../dashboard/dashboard.html">Dashboard</a>
                <span class="link-desabilitado">Cursos</span>
                <a href="./cadastro-aluno.html">Cadastro de Alunos</a>
                <a href="#" id="btnSair">Sair</a>
            </nav>
        </aside>
        <main class="conteudo">
            <h2>Cadastro de Aluno</h2>
            <section>
                <form>
                    <fieldset id="dadosAluno">
                        <div class="campo">
                            <label for="nome">Nome Completo *</label>
                            <input id="nome" type="text" minlength="4" maxlength="80" required>
                        </div>
                        <div class="campo">
                            <label for="genero">Gênero *</label>
                            <select name="genero" id="genero" required>
                                <option value="">Selecione uma opção</option>
                                <option value="Feminino">Feminino</option>
                                <option value="Masculino">Masculino</option>
                                <option value="Outro">Outro</option>
                                <option value="Prefiro não informar">Prefiro não informar</option>
                            </select>
                        </div>
                        <div class="campo">
                            <label for="dataNascimento">Data de Nascimento *</label>
                            <input id="dataNascimento" type="date" required>
                        </div>
                        <div class="campo">
                            <label for="cpf">CPF *</label>
                            <input id="cpf" type="number" required>
                        </div>
                        <div class="campo">
                            <label for="telefone">Telefone *</label>
                            <input id="telefone" type="number" required>
                        </div>
                        <div class="campo">
                            <label for="email">Email *</label>
                            <input id="email" type="email" required>
                        </div>
                    </fieldset>
                    <fieldset id="endereco">
                        <legend>Endereço</legend>
                        <div class="campo">
                            <label for="cep">CEP *</label>
                            <input id="cep" type="number" required>
                        </div>
                        <div class="campo">
                            <label for="logradouro">Logradouro *</label>
                            <input id="logradouro" type="text" required>
                        </div>
                        <div class="campo">
                            <label for="numero">Número *</label>
                            <input id="numero" type="number" required>
                        </div>
                        <div class="campo">
                            <label for="bairro">Bairro *</label>
                            <input id="bairro" type="text" required>
                        </div>
                        <div class="campo">
                            <label for="complemento">Complemento</label>
                            <input id="complemento" type="text">
                        </div>
                        <div class="campo">
                            <label for="cidade">Cidade *</label>
                            <input id="cidade" type="text" required>
                        </div>
                        <div class="campo">
                            <label for="estado">Estado *</label>
                            <input id="estado" type="text" required>
                        </div>
                    </fieldset>
                    <button id="btnSalvar">Salvar</button>
                </form>
            </section>
        </main>
    </div>
</body>

</html>
